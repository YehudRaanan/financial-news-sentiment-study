name: reproducibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.1"
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run python -c "import google.cloud.bigquery, trafilatura, yfinance, torch, transformers, refined"
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run python examples/reproduce_example.py --output outputs/example
